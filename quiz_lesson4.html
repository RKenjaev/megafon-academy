<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квиз — Занятие 4 | IT Project Management</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f4;
    --bg-info: #fef3e2;
    --bg-success: #eaf3de;
    --bg-danger: #fcebeb;
    --text: #1a1a1a;
    --text-secondary: #6b7280;
    --text-info: #92500a;
    --text-success: #3b6d11;
    --text-danger: #a32d2d;
    --border: rgba(0,0,0,0.12);
    --border-secondary: rgba(0,0,0,0.22);
    --border-info: #e8a020;
    --border-success: #97c459;
    --border-danger: #f09595;
    --radius: 8px;
    --radius-lg: 12px;
    --accent: #e8a020;
    --accent-dark: #1e2328;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e2328;
      --bg-secondary: #2c3540;
      --bg-info: #6b3a05;
      --bg-success: #27500a;
      --bg-danger: #791f1f;
      --text: #f2f2f7;
      --text-secondary: #aeaeb2;
      --text-info: #f5c842;
      --text-success: #c0dd97;
      --text-danger: #f7c1c1;
      --border: rgba(255,255,255,0.10);
      --border-secondary: rgba(255,255,255,0.22);
      --border-info: #e8a020;
      --border-success: #639922;
      --border-danger: #e24b4a;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-secondary);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 2rem;
    width: 100%;
    max-width: 600px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* START SCREEN */
  .hero { text-align: center; padding: 1rem 0 2rem; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-info); color: var(--text-info);
    border: 0.5px solid var(--border-info);
    border-radius: 20px; padding: 4px 14px;
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; margin-bottom: 1.25rem;
  }
  .hero-icon { font-size: 52px; color: var(--border-info); margin-bottom: 1rem; }
  .hero h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: .5rem; }
  .hero p  { font-size: 15px; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.7; }

  .meta-row { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .meta-item i { font-size: 16px; }

  .start-btn {
    background: var(--bg-info); color: var(--text-info);
    border: 1px solid var(--border-info);
    border-radius: var(--radius-lg); padding: .85rem 2.5rem;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .start-btn:hover { opacity: .85; }

  /* QUESTION SCREEN */
  .q-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .q-counter { font-size: 13px; color: var(--text-secondary); }
  .timer-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg-secondary); border-radius: var(--radius); padding: .35rem .75rem; }
  .timer-val { font-size: 14px; font-weight: 600; color: var(--text); min-width: 20px; text-align: center; }
  .timer-val.urgent { color: var(--text-danger); }

  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 1.75rem; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--border-info); border-radius: 2px; transition: width .4s ease; }

  .q-text { font-size: 17px; font-weight: 500; color: var(--text); line-height: 1.55; margin-bottom: 1.5rem; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: .85rem 1rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer; background: var(--bg);
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(.disabled) { border-color: var(--border-info); background: var(--bg-info); }
  .opt-letter {
    width: 30px; height: 30px; border-radius: 50%;
    border: 0.5px solid var(--border-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; color: var(--text-secondary); flex-shrink: 0;
  }
  .opt-text { font-size: 14px; color: var(--text); line-height: 1.4; }
  .opt.correct { border-color: var(--border-success); background: var(--bg-success); }
  .opt.correct .opt-letter { border-color: var(--border-success); color: var(--text-success); }
  .opt.wrong   { border-color: var(--border-danger);  background: var(--bg-danger); }
  .opt.wrong   .opt-letter { border-color: var(--border-danger);  color: var(--text-danger); }
  .opt.disabled { cursor: default; }

  .explanation {
    margin-top: 1rem; padding: .85rem 1rem;
    background: var(--bg-secondary); border-radius: var(--radius);
    font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--text); font-weight: 500; }

  .next-btn {
    margin-top: 1.25rem; width: 100%; padding: .75rem;
    border: 0.5px solid var(--border-secondary); border-radius: var(--radius-lg);
    background: var(--bg); color: var(--text);
    font-size: 14px; cursor: pointer; display: none; transition: background .15s;
  }
  .next-btn:hover { background: var(--bg-secondary); }
  .next-btn.show { display: block; }

  /* RESULTS SCREEN */
  .results-wrap { text-align: center; padding: 1rem 0 1rem; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid var(--border-info);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .score-num   { font-size: 32px; font-weight: 600; color: var(--text-info); }
  .score-label { font-size: 12px; color: var(--text-secondary); }
  .result-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: .5rem; }
  .result-sub   { font-size: 14px; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6; }

  .answers-review { text-align: left; margin-bottom: 2rem; }
  .rev-item { display: flex; align-items: flex-start; gap: 10px; padding: .75rem 0; border-bottom: 0.5px solid var(--border); }
  .rev-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
  .rev-icon.ok { color: var(--text-success); }
  .rev-icon.no { color: var(--text-danger); }
  .rev-q { font-size: 13px; color: var(--text-secondary); margin-bottom: 3px; line-height: 1.4; }
  .rev-a { font-size: 13px; color: var(--text); font-weight: 500; }

  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .retry-btn {
    border: 0.5px solid var(--border-secondary); border-radius: var(--radius-lg);
    padding: .75rem 1.5rem; font-size: 14px; cursor: pointer;
    background: var(--bg); color: var(--text); transition: background .15s;
  }
  .retry-btn:hover { background: var(--bg-secondary); }
  .share-btn {
    border: none; border-radius: var(--radius-lg);
    padding: .75rem 1.5rem; font-size: 14px; cursor: pointer;
    background: var(--bg-info); color: var(--text-info); transition: opacity .15s;
  }
  .share-btn:hover { opacity: .85; }

  .footer { text-align: center; margin-top: 1.5rem; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="card">

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="hero">
      <div class="hero-icon"><i class="ti ti-layout-kanban"></i></div>
      <div class="hero-badge"><i class="ti ti-school"></i> IT Project Management · Занятие 4</div>
      <h1>Kanban: Методология гибкого управления</h1>
      <p>Проверь, насколько хорошо ты усвоил историю Kanban, pull-систему, WIP-лимиты, Правило Литтла и Scrumban.</p>
      <div class="meta-row">
        <div class="meta-item"><i class="ti ti-help-circle"></i> 10 вопросов</div>
        <div class="meta-item"><i class="ti ti-clock"></i> ~5 минут</div>
        <div class="meta-item"><i class="ti ti-trophy"></i> Рейтинг по итогу</div>
      </div>
      <button class="start-btn" onclick="startQuiz()">
        <i class="ti ti-player-play"></i> Начать квиз
      </button>
    </div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="screen-question">
    <div class="q-header">
      <span class="q-counter" id="q-counter">Вопрос 1 из 10</span>
      <div class="timer-wrap">
        <i class="ti ti-clock" style="font-size:15px;color:var(--text-secondary)"></i>
        <span class="timer-val" id="timer-val">20</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()"></button>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screen-results">
    <div class="results-wrap">
      <div class="score-circle" id="score-circle">
        <span class="score-num" id="score-num">0/10</span>
        <span class="score-label">результат</span>
      </div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub"   id="result-sub"></div>
      <div class="answers-review" id="answers-review"></div>
      <div class="btn-row">
        <button class="retry-btn" onclick="restartQuiz()"><i class="ti ti-refresh"></i> Пройти снова</button>
        <button class="share-btn" onclick="shareResult()"><i class="ti ti-copy"></i> Скопировать результат</button>
      </div>
    </div>
  </div>

</div>

<div class="footer">IT Project Management · Занятие 4 · Kanban</div>

<script>
const questions = [
  {
    q: "В 1953 году Toyota внедрила Kanban на своих заводах. Какую конкретную проблему производства он решал?",
    opts: [
      "Сотрудники не знали своих задач на день",
      "Склады были либо переполнены, либо пустели в нужный момент — конвейер простаивал",
      "Не хватало рабочих на конвейере",
      "Производство не успевало за спросом из-за устаревшего оборудования"
    ],
    correct: 1,
    explanation: "<strong>Верно!</strong> Проблема Toyota была в балансе запасов: либо склад переполнен (деньги заморожены), либо нужной детали нет и конвейер стоит. Kanban-карточка стала сигналом «нужна деталь» — производство запускалось только по реальному запросу."
  },
  {
    q: "Дэвид является менеджером IT-команды и хочет внедрить Kanban. Команда уже работает по своим процессам. Что говорит первый принцип Kanban?",
    opts: [
      "Сначала нужно уволить всех Project Manager-ов",
      "Начни с нуля — старые процессы мешают",
      "Начни с того, что есть — внедряй Kanban поверх существующего процесса",
      "Сначала обучи всю команду и только потом начинай"
    ],
    correct: 2,
    explanation: "<strong>Верно!</strong> Первый принцип Kanban: «Начни с того, что есть». Не нужно революций и реструктуризаций. Kanban — самый мягкий из Agile-методов: он накладывается на существующий процесс и улучшает его постепенно."
  },
  {
    q: "В чём ключевое отличие Pull-системы (вытягивающей) от Push-системы (толкающей)?",
    opts: [
      "В Pull-системе работу назначает менеджер, в Push — сама команда",
      "Pull-система быстрее только в производстве, но не в IT",
      "В Push-системе команда сама берёт задачи по мере готовности; в Pull — получает по расписанию",
      "В Pull-системе новая задача берётся только тогда, когда есть реальный спрос и свободная мощность"
    ],
    correct: 3,
    explanation: "<strong>Верно!</strong> Pull (вытягивающая) система: работа начинается только когда есть реальный спрос и команда готова её взять. Push (толкающая): менеджер планирует задачи заранее и «толкает» их в команду — это создаёт очереди и перегрузку."
  },
  {
    q: "Команда разработки ведёт Kanban-доску. В колонке «In Progress» одновременно висят 9 задач у 4 разработчиков. Что произойдёт согласно Правилу Литтла?",
    opts: [
      "Команда работает эффективно — больше задач в работе, больше результата",
      "Lead Time вырастет: каждая задача будет ждать дольше, пока дойдёт до завершения",
      "Throughput автоматически вырастет пропорционально количеству задач",
      "Ничего не изменится, если разработчики опытные"
    ],
    correct: 1,
    explanation: "<strong>Верно!</strong> По Правилу Литтла: Lead Time = WIP ÷ Throughput. При росте WIP с 4 до 9 задач, Lead Time вырастет примерно в 2 раза — каждая задача будет ждать своей очереди дольше. Меньше WIP = быстрее каждая задача доходит до результата."
  },
  {
    q: "Чем «Метод Kanban» (David Anderson, 2004) отличается от «Системы Kanban» Toyota?",
    opts: [
      "Это одно и то же — просто разные переводы",
      "Система Kanban — для IT, Метод Kanban — для производства",
      "Метод Kanban адаптирует принципы Toyota для управления интеллектуальным трудом в IT и сфере услуг",
      "Метод Kanban заменяет все роли и процессы, а система Toyota — нет"
    ],
    correct: 2,
    explanation: "<strong>Верно!</strong> Система Kanban Toyota — физические карточки для управления запасами на производстве (1953). Метод Kanban Андерсона (2004) — управленческий подход для IT-команд: 4 принципа + 6 практик, адаптированные для разработки ПО и сервисных команд."
  },
  {
    q: "Какая из шести практик Kanban помогает команде понять, где задачи «застревают» и не двигаются к завершению?",
    opts: [
      "Визуализируй работу — Kanban-доска показывает состояние каждой задачи",
      "Сделай правила явными — все договорённости видны команде",
      "Улучшай совместно — команда обсуждает проблемы",
      "Управляй петлями обратной связи — регулярные встречи для анализа"
    ],
    correct: 0,
    explanation: "<strong>Верно!</strong> Первая практика Kanban — «Визуализируй работу». Kanban-доска делает весь поток задач прозрачным: сразу видно, где задачи накапливаются («узкое место»), где застревают, и у кого слишком много работы одновременно."
  },
  {
    q: "Lead Time команды = 10 дней, Throughput = 2 задачи в день. Чему равен WIP согласно Правилу Литтла?",
    opts: [
      "5 задач",
      "12 задач",
      "20 задач",
      "8 задач"
    ],
    correct: 2,
    explanation: "<strong>Верно!</strong> Правило Литтла: Lead Time = WIP ÷ Throughput, значит WIP = Lead Time × Throughput = 10 × 2 = 20 задач. Это много! Чтобы сократить Lead Time до 5 дней при том же Throughput, нужно снизить WIP до 10 задач."
  },
  {
    q: "Стартап переходит с Waterfall на Agile. Команда хочет гибкость Kanban, но привыкла к регулярным ретроспективам и планированию из Scrum. Что им подойдёт?",
    opts: [
      "Нужно выбрать одно: либо Scrum, либо Kanban — совмещать нельзя",
      "Scrumban — гибрид, сочетающий спринты и ретроспективы Scrum с WIP-лимитами и потоком Kanban",
      "Лучше остаться на Waterfall — он стабильнее для начинающих",
      "SAFe (Scaled Agile Framework) — единственное правильное решение"
    ],
    correct: 1,
    explanation: "<strong>Верно!</strong> Scrumban — это именно то, что нужно: спринты + ретроспективы из Scrum, плюс WIP-лимиты и непрерывный поток из Kanban. Идеально для команд в переходном периоде или тех, кто занимается поддержкой продукта с непредсказуемым потоком задач."
  },
  {
    q: "Команда поддержки клиентов банка хочет внедрить Kanban. Какая метрика лучше всего покажет, насколько быстро клиенты получают ответ на обращение?",
    opts: [
      "Throughput — количество закрытых обращений в день",
      "WIP — количество обращений в работе",
      "Lead Time — время от момента обращения до его закрытия",
      "Cycle Time — время активной обработки без ожидания оператора"
    ],
    correct: 2,
    explanation: "<strong>Верно!</strong> Lead Time — это полное время с точки зрения клиента: от момента подачи обращения до получения ответа. Именно эту метрику чувствует клиент. Cycle Time покажет только время активной работы оператора, но не учтёт время ожидания в очереди."
  },
  {
    q: "Kanban применяется не только в IT. В какой из перечисленных сфер Kanban был использован исторически ПЕРВЫМ?",
    opts: [
      "Разработка программного обеспечения",
      "Здравоохранение и управление пациентами",
      "Производство автомобилей на заводах Toyota",
      "Маркетинг и управление контентом"
    ],
    correct: 2,
    explanation: "<strong>Верно!</strong> Kanban возник именно на автомобильных заводах Toyota в 1940–1950-х годах как физическая карточка-сигнал для управления запасами деталей. В IT Kanban пришёл лишь в 2004 году благодаря Дэвиду Андерсону — спустя полвека после Toyota."
  }
];

let current = 0, score = 0, answers = [], timer = null, timeLeft = 20, answered = false;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() { current = 0; score = 0; answers = []; show('screen-question'); renderQuestion(); }

function renderQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('q-counter').textContent = `Вопрос ${current + 1} из ${questions.length}`;
  document.getElementById('progress-fill').style.width = `${(current / questions.length) * 100}%`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('explanation').className = 'explanation';
  document.getElementById('next-btn').className = 'next-btn';
  const letters = ['А', 'Б', 'В', 'Г'];
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.innerHTML = `<div class="opt-letter">${letters[i]}</div><div class="opt-text">${o}</div>`;
    d.onclick = () => selectAnswer(i);
    opts.appendChild(d);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timer); timeLeft = 20; updateTimer();
  timer = setInterval(() => {
    timeLeft--; updateTimer();
    if (timeLeft <= 0) { clearInterval(timer); if (!answered) timeOut(); }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timer-val');
  el.textContent = timeLeft;
  el.className = timeLeft <= 5 ? 'timer-val urgent' : 'timer-val';
}

function timeOut() {
  answered = true;
  answers.push({ qIdx: current, selected: -1, correct: false });
  revealAnswer(-1);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true; clearInterval(timer);
  const isCorrect = idx === questions[current].correct;
  if (isCorrect) score++;
  answers.push({ qIdx: current, selected: idx, correct: isCorrect });
  revealAnswer(idx);
}

function revealAnswer(selected) {
  const q = questions[current];
  document.querySelectorAll('.opt').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.correct) el.classList.add('correct');
    else if (i === selected && selected !== q.correct) el.classList.add('wrong');
  });
  const exp = document.getElementById('explanation');
  const baseText = q.explanation.replace('<strong>Верно!</strong> ', '');
  if (selected === -1) {
    exp.innerHTML = `<strong>Время вышло!</strong> Правильный ответ выделен зелёным. ${baseText}`;
  } else if (selected === q.correct) {
    exp.innerHTML = `<strong>Верно!</strong> ${baseText}`;
  } else {
    exp.innerHTML = `<strong>Неверно.</strong> ${baseText}`;
  }
  exp.classList.add('show');
  const nb = document.getElementById('next-btn');
  nb.textContent = current < questions.length - 1 ? 'Следующий вопрос →' : 'Посмотреть результаты →';
  nb.classList.add('show');
}

function nextQuestion() { current++; if (current < questions.length) renderQuestion(); else showResults(); }

function showResults() {
  clearInterval(timer); show('screen-results');
  document.getElementById('score-num').textContent = `${score}/${questions.length}`;
  const pct = score / questions.length;
  const ok = pct >= 0.6;
  const configs = [
    { min: 0.9,  title: 'Kanban-мастер! 🏆',       sub: 'Ты отлично усвоил материал занятия 4. История, принципы, метрики и Scrumban — всё под контролем. Готов к следующей теме!' },
    { min: 0.6,  title: 'Хороший результат!',       sub: 'Основы Kanban усвоены. Перечитай объяснения к вопросам, где ошибся — особенно по Правилу Литтла и Pull-системе.' },
    { min: 0,    title: 'Стоит повторить материал', sub: 'Рекомендуем вернуться к слайдам занятия 4 и пройти квиз снова. Особое внимание — на WIP-лимиты, Pull-систему и метрики Kanban.' },
  ];
  const cfg = configs.find(c => pct >= c.min);
  document.getElementById('result-title').textContent = cfg.title;
  document.getElementById('result-sub').textContent = cfg.sub;
  const circle = document.getElementById('score-circle');
  circle.style.borderColor = ok ? 'var(--border-success)' : 'var(--border-danger)';
  document.getElementById('score-num').style.color = ok ? 'var(--text-success)' : 'var(--text-danger)';
  document.getElementById('answers-review').innerHTML = answers.map(a => {
    const q = questions[a.qIdx];
    const sel = a.selected >= 0 ? q.opts[a.selected] : 'Время вышло';
    return `<div class="rev-item">
      <i class="ti ${a.correct ? 'ti-circle-check' : 'ti-circle-x'} rev-icon ${a.correct ? 'ok' : 'no'}"></i>
      <div>
        <div class="rev-q">${q.q}</div>
        <div class="rev-a">${a.correct ? q.opts[q.correct] : `Ваш ответ: ${sel} · Правильно: ${q.opts[q.correct]}`}</div>
      </div>
    </div>`;
  }).join('');
}

function restartQuiz() { startQuiz(); }

function shareResult() {
  const text = `Квиз по занятию 4 «IT Project Management» — Kanban\nМой результат: ${score}/${questions.length} правильных ответов`;
  navigator.clipboard
    ? navigator.clipboard.writeText(text).then(() => alert('Результат скопирован! Отправь его ментору.'))
    : alert(text);
}
</script>
