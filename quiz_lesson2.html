<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квиз — Занятие 2 | IT Project Management</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg-s: #f0f7fa; --bg-info: #e0f0f7;
    --bg-ok: #e6f4d8; --bg-err: #fceaea;
    --text: #021B2E; --text-s: #5a8a9f;
    --text-info: #065A82; --text-ok: #2e6b0e; --text-err: #a32d2d;
    --b: rgba(6,90,130,0.15); --b2: rgba(6,90,130,0.28);
    --b-info: #1C7293; --b-ok: #7aba3a; --b-err: #e87a7a;
    --mint: #02C39A; --r: 8px; --rl: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#021B2E; --bg-s:#0a2e45; --bg-info:#0c4060;
      --bg-ok:#1a4008; --bg-err:#5c1414;
      --text:#e8f4f8; --text-s:#7fb3c8;
      --text-info:#7dd4f0; --text-ok:#a8d97a; --text-err:#f5a0a0;
      --b:rgba(125,212,240,0.15); --b2:rgba(125,212,240,0.28);
      --b-info:#1C7293; --b-ok:#4a9a1a; --b-err:#c04040;
    }
  }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg-s); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2rem 1rem 3rem; }
  .card { background:var(--bg); border-radius:var(--rl); border:0.5px solid var(--b); padding:2rem; width:100%; max-width:620px; box-shadow:0 4px 24px rgba(6,90,130,0.08); }
  .screen { display:none; } .screen.active { display:block; }

  .hero { text-align:center; padding:.5rem 0 1.5rem; }
  .badge { display:inline-block; background:var(--bg-info); color:var(--text-info); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:.3rem .85rem; border-radius:999px; margin-bottom:1.2rem; }
  .hero h1 { font-size:24px; font-weight:600; margin-bottom:.5rem; }
  .hero p { font-size:14px; color:var(--text-s); line-height:1.7; margin-bottom:1.75rem; }
  .meta-row { display:flex; justify-content:center; gap:1rem; margin-bottom:1.75rem; flex-wrap:wrap; }
  .meta-item { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-s); background:var(--bg-s); padding:.35rem .85rem; border-radius:999px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--mint); flex-shrink:0; }
  .start-btn { background:var(--text-info); color:#fff; border:none; border-radius:var(--rl); padding:.9rem 2.5rem; font-size:16px; font-weight:600; cursor:pointer; transition:opacity .15s,transform .1s; }
  .start-btn:hover { opacity:.88; transform:translateY(-1px); }

  .q-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
  .q-counter { font-size:13px; color:var(--text-s); font-weight:500; }
  .timer-wrap { display:flex; align-items:center; gap:7px; background:var(--bg-s); border-radius:999px; padding:.3rem .85rem; }
  .tdot { width:7px; height:7px; border-radius:50%; background:var(--mint); flex-shrink:0; transition:background .3s; }
  .tdot.u { background:var(--b-err); }
  .tval { font-size:14px; font-weight:600; color:var(--text); min-width:22px; }
  .tval.u { color:var(--text-err); }

  .pbar { height:3px; background:var(--b); border-radius:2px; margin-bottom:1.5rem; overflow:hidden; }
  .pfill { height:100%; background:var(--mint); border-radius:2px; transition:width .4s ease; }

  .q-text { font-size:17px; font-weight:500; line-height:1.55; margin-bottom:1.25rem; }
  .options { display:flex; flex-direction:column; gap:9px; }
  .opt { display:flex; align-items:flex-start; gap:12px; padding:.85rem 1rem; border:0.5px solid var(--b); border-radius:var(--rl); cursor:pointer; background:var(--bg); transition:border-color .15s,background .15s; }
  .opt:hover:not(.disabled) { border-color:var(--b-info); background:var(--bg-info); }
  .opt-l { width:28px; height:28px; border-radius:50%; flex-shrink:0; border:0.5px solid var(--b2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-s); margin-top:1px; }
  .opt-t { font-size:14px; line-height:1.45; }
  .opt.ok { border-color:var(--b-ok); background:var(--bg-ok); }
  .opt.ok .opt-l { border-color:var(--b-ok); color:var(--text-ok); }
  .opt.no { border-color:var(--b-err); background:var(--bg-err); }
  .opt.no .opt-l { border-color:var(--b-err); color:var(--text-err); }
  .opt.disabled { cursor:default; }

  .exp { display:none; margin-top:1rem; padding:.9rem 1rem; background:var(--bg-s); border-radius:var(--r); font-size:13px; color:var(--text-s); line-height:1.65; border-left:3px solid var(--mint); }
  .exp.show { display:block; }
  .exp strong { color:var(--text); font-weight:600; }

  .next-btn { display:none; margin-top:1.1rem; width:100%; padding:.75rem; border:0.5px solid var(--b2); border-radius:var(--rl); background:var(--bg); color:var(--text); font-size:14px; font-weight:500; cursor:pointer; transition:background .15s; }
  .next-btn:hover { background:var(--bg-s); }
  .next-btn.show { display:block; }

  .results-wrap { text-align:center; padding:.5rem 0 1rem; }
  .ring { width:110px; height:110px; border-radius:50%; border:3px solid var(--b-info); display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 1.4rem; }
  .snum { font-size:30px; font-weight:700; color:var(--text-info); }
  .slabel { font-size:11px; color:var(--text-s); margin-top:1px; }
  .rtitle { font-size:20px; font-weight:600; margin-bottom:.45rem; }
  .rsub { font-size:14px; color:var(--text-s); line-height:1.65; margin-bottom:1.75rem; }

  .revlist { text-align:left; margin-bottom:1.75rem; }
  .ritem { display:flex; align-items:flex-start; gap:10px; padding:.7rem 0; border-bottom:0.5px solid var(--b); }
  .rico { font-size:15px; flex-shrink:0; margin-top:2px; }
  .rico.ok { color:var(--text-ok); } .rico.no { color:var(--text-err); }
  .rq { font-size:12px; color:var(--text-s); margin-bottom:3px; line-height:1.4; }
  .ra { font-size:13px; font-weight:500; line-height:1.4; }
  .ra.wrong { color:var(--text-err); }
  .ra.hint { font-weight:400; font-size:12px; color:var(--text-s); margin-top:2px; }

  .btn-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btn-sec { border:0.5px solid var(--b2); border-radius:var(--rl); padding:.72rem 1.4rem; font-size:14px; font-weight:500; cursor:pointer; background:var(--bg); color:var(--text); transition:background .15s; }
  .btn-sec:hover { background:var(--bg-s); }
  .btn-pri { border:none; border-radius:var(--rl); padding:.72rem 1.4rem; font-size:14px; font-weight:600; cursor:pointer; background:var(--text-info); color:#fff; transition:opacity .15s; }
  .btn-pri:hover { opacity:.88; }

  .footer { margin-top:1.5rem; font-size:11px; color:var(--text-s); text-align:center; opacity:.7; }
  .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(10px); background:var(--text); color:var(--bg); padding:.65rem 1.4rem; border-radius:999px; font-size:13px; font-weight:500; opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="card">

  <div class="screen active" id="s-start">
    <div class="hero">
      <div class="badge">Академия Мегафон · IT Project Management</div>
      <h1>Квиз — Занятие 2</h1>
      <p>Agile-манифест, Scrum и MVP<br>Проверь, как усвоил материал второго занятия</p>
      <div class="meta-row">
        <div class="meta-item"><div class="dot"></div>5 вопросов</div>
        <div class="meta-item"><div class="dot"></div>20 сек на вопрос</div>
        <div class="meta-item"><div class="dot"></div>~2 минуты</div>
      </div>
      <button class="start-btn" onclick="startQuiz()">Начать квиз →</button>
    </div>
  </div>

  <div class="screen" id="s-question">
    <div class="q-header">
      <span class="q-counter" id="qc">Вопрос 1 из 5</span>
      <div class="timer-wrap"><div class="tdot" id="td"></div><span class="tval" id="tv">20</span></div>
    </div>
    <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
    <div class="q-text" id="qt"></div>
    <div class="options" id="opts"></div>
    <div class="exp" id="exp"></div>
    <button class="next-btn" id="nb" onclick="nextQ()"></button>
  </div>

  <div class="screen" id="s-results">
    <div class="results-wrap">
      <div class="ring" id="ring"><span class="snum" id="snum">0/5</span><span class="slabel">результат</span></div>
      <div class="rtitle" id="rtitle"></div>
      <div class="rsub" id="rsub"></div>
      <div class="revlist" id="revlist"></div>
      <div class="btn-row">
        <button class="btn-sec" onclick="startQuiz()">↩ Пройти снова</button>
        <button class="btn-pri" onclick="shareResult()">Скопировать результат</button>
      </div>
    </div>
  </div>

</div>
<div class="footer">Академия Мегафон · Курс IT Project Management · Занятие 2</div>
<div class="toast" id="toast">Результат скопирован!</div>

<script>
const Qs = [
  {
    q: "В каком году и где был создан Agile Manifesto?",
    opts: ["1999 год, Силиконовая долина, Калифорния","2001 год, горнолыжный курорт Snowbird, штат Юта","1995 год, Бостон, на IT-конференции","2001 год, Лондон, на встрече разработчиков"],
    c: 1,
    exp: "<strong>Верно!</strong> В феврале 2001 года 17 ведущих разработчиков собрались на горнолыжном курорте Snowbird в штате Юта. За 3 дня они создали Agile Manifesto, который изменил всю индустрию разработки ПО."
  },
  {
    q: "Какая из 4 ценностей Agile Manifesto сформулирована верно?",
    opts: ["Документация важнее работающего продукта","Следование плану важнее готовности к изменениям","Сотрудничество с заказчиком важнее согласования условий контракта","Процессы и инструменты важнее людей и взаимодействия"],
    c: 2,
    exp: "<strong>Верно!</strong> Одна из 4 ценностей: сотрудничество с заказчиком важнее согласования условий контракта. Остальные варианты — намеренно перевёрнутые формулировки манифеста."
  },
  {
    q: "Что такое MVP в контексте Agile-разработки?",
    opts: ["Самый ценный участник команды (Most Valuable Player)","Финальная версия продукта со всеми функциями","Минимально жизнеспособный продукт для проверки гипотезы","Подробный документ с требованиями к продукту"],
    c: 2,
    exp: "<strong>Верно!</strong> MVP (Minimum Viable Product) — версия продукта с минимальным набором функций, достаточных для того, чтобы клиент мог им пользоваться и давать обратную связь. Цель — проверить гипотезу с минимальными затратами."
  },
  {
    q: "Кто впервые использовал слово «Scrum» применительно к разработке продуктов и в каком издании?",
    opts: ["Кен Швабер и Джефф Сазерленд в журнале Forbes","Такеучи и Нонака в Harvard Business Review, 1986 год","Участники Agile Manifesto в своём официальном документе","Разработчики IBM во внутреннем отчёте, 1992 год"],
    c: 1,
    exp: "<strong>Верно!</strong> В 1986 году японские исследователи Такеучи и Нонака опубликовали статью \"The New New Product Development Game\" в Harvard Business Review. Они сравнили эффективные команды с построением в регби — Scrum."
  },
  {
    q: "Scrum создан для IT. Что верно про его применение в других сферах?",
    opts: ["Scrum нельзя использовать за пределами разработки ПО","Scrum применяется только в стартапах, но не в крупных компаниях","Scrum подходит только для команд до 5 человек","Scrum успешно применяется в маркетинге, образовании и других сферах"],
    c: 3,
    exp: "<strong>Верно!</strong> Scrum создан для IT, но его принципы универсальны. NASA использовала Scrum при разработке миссий, школы в Нидерландах применяют его в учебном процессе. Scrum подходит везде, где есть команда, цель и неопределённость."
  }
];

let cur=0, score=0, answers=[], tmr=null, tLeft=20, done=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startQuiz(){cur=0;score=0;answers=[];show('s-question');renderQ();}

function renderQ(){
  done=false;
  const q=Qs[cur];
  document.getElementById('qc').textContent=`Вопрос ${cur+1} из ${Qs.length}`;
  document.getElementById('pf').style.width=`${cur/Qs.length*100}%`;
  document.getElementById('qt').textContent=q.q;
  document.getElementById('exp').className='exp';
  document.getElementById('nb').className='next-btn';
  const L=['А','Б','В','Г'];
  const el=document.getElementById('opts');
  el.innerHTML='';
  q.opts.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='opt';
    d.innerHTML=`<div class="opt-l">${L[i]}</div><div class="opt-t">${o}</div>`;
    d.onclick=()=>pick(i);
    el.appendChild(d);
  });
  tick();
}

function tick(){
  clearInterval(tmr);tLeft=20;upd();
  tmr=setInterval(()=>{tLeft--;upd();if(tLeft<=0){clearInterval(tmr);if(!done)timeOut();}},1000);
}

function upd(){
  const v=document.getElementById('tv'),d=document.getElementById('td');
  v.textContent=tLeft;
  v.className=tLeft<=5?'tval u':'tval';
  d.className=tLeft<=5?'tdot u':'tdot';
}

function timeOut(){done=true;answers.push({i:cur,sel:-1,ok:false});reveal(-1);}

function pick(idx){
  if(done)return;done=true;clearInterval(tmr);
  const ok=idx===Qs[cur].c;
  if(ok)score++;
  answers.push({i:cur,sel:idx,ok});
  reveal(idx);
}

function reveal(sel){
  const q=Qs[cur];
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===q.c)el.classList.add('ok');
    else if(i===sel&&sel!==q.c)el.classList.add('no');
  });
  const exp=document.getElementById('exp');
  const cleanExp2 = q.exp.replace('<strong>Верно!</strong> ', '');
  if (sel === -1) {
    exp.innerHTML = `<strong>Время вышло!</strong> Правильный ответ выделен зелёным. ${cleanExp2}`;
  } else if (sel === q.c) {
    exp.innerHTML = q.exp;
  } else {
    exp.innerHTML = `<strong>Неверно.</strong> ${cleanExp2}`;
  }
  exp.classList.add('show');
  const nb=document.getElementById('nb');
  nb.textContent=cur<Qs.length-1?'Следующий вопрос →':'Посмотреть результаты →';
  nb.classList.add('show');
}

function nextQ(){cur++;if(cur<Qs.length)renderQ();else showResults();}

function showResults(){
  clearInterval(tmr);show('s-results');
  document.getElementById('snum').textContent=`${score}/${Qs.length}`;
  const p=score/Qs.length;
  const ring=document.getElementById('ring'),sn=document.getElementById('snum');
  let title,sub;
  if(p===1){ring.style.borderColor='var(--b-ok)';sn.style.color='var(--text-ok)';title='Идеальный результат!';sub='Ты отлично усвоил материал занятия 2. Готов к занятию 3 — роли в Scrum и артефакты!';}
  else if(p>=0.6){ring.style.borderColor='var(--b-info)';sn.style.color='var(--text-info)';title='Хороший результат!';sub='Основы усвоены. Перечитай объяснения к вопросам, на которых ошибся.';}
  else{ring.style.borderColor='var(--b-err)';sn.style.color='var(--text-err)';title='Стоит повторить материал';sub='Рекомендуем вернуться к слайдам занятия 2 и пройти квиз ещё раз. Всё получится!';}
  document.getElementById('rtitle').textContent=title;
  document.getElementById('rsub').textContent=sub;
  document.getElementById('revlist').innerHTML=answers.map(a=>{
    const q=Qs[a.i];
    const sel=a.sel>=0?q.opts[a.sel]:'Время вышло';
    return `<div class="ritem">
      <span class="rico ${a.ok?'ok':'no'}">${a.ok?'✓':'✗'}</span>
      <div>
        <div class="rq">${q.q}</div>
        <div class="ra ${a.ok?'':'wrong'}">${a.ok?q.opts[q.c]:`Ваш ответ: ${sel}`}</div>
        ${!a.ok?`<div class="ra hint">Правильно: ${q.opts[q.c]}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function shareResult(){
  const t=`Квиз по занятию 2 «IT Project Management» (Академия Мегафон)\nТема: Agile-манифест, Scrum и MVP\nМой результат: ${score}/${Qs.length} правильных ответов`;
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>{const el=document.getElementById('toast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}):alert(t);
}
</script>
</body>
</html>
